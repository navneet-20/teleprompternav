name: Build APK and AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'bugfix/**'
      - features
      - 'playstore/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Android SDK tools
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build debug APK and AAB
        run: |
          gradle :app:assembleDebug :app:bundleDebug --no-daemon --stacktrace

      - name: Read app version
        shell: bash
        run: |
          VERSION=$(grep -o "versionName '[^']*'" app/build.gradle | cut -d"'" -f2)
          SAFE_REF=$(printf '%s' "\${GITHUB_REF_NAME}" | tr '/' '-')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "SAFE_REF=$SAFE_REF" >> "$GITHUB_ENV"

      - name: Prepare versioned APK and AAB filenames
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/TeleprompterPro-v${VERSION}.apk"
          cp app/build/outputs/bundle/debug/app-debug.aab "app/build/outputs/bundle/debug/TeleprompterPro-v${VERSION}.aab"

      - name: Upload versioned APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: TeleprompterPro-v${{ env.VERSION }}-${{ env.SAFE_REF }}
          path: |
            app/build/outputs/apk/debug/TeleprompterPro-v${{ env.VERSION }}.apk
            app/build/outputs/bundle/debug/TeleprompterPro-v${{ env.VERSION }}.aab
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          echo "Releasing version $VERSION"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists; uploading APK and AAB."
            gh release upload "v$VERSION" \
              "app/build/outputs/apk/debug/TeleprompterPro-v${VERSION}.apk" \
              "app/build/outputs/bundle/debug/TeleprompterPro-v${VERSION}.aab" \
              --clobber
          else
            gh release create "v$VERSION"               "app/build/outputs/apk/debug/TeleprompterPro-v${VERSION}.apk"               "app/build/outputs/bundle/debug/TeleprompterPro-v${VERSION}.aab"               --title "Teleprompter Pro v$VERSION"               --generate-notes
          fi