name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Android SDK tools
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK_ROOT=$SDK_ROOT"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            find "$SDK_ROOT" -maxdepth 4 -type f -name sdkmanager -print 2>/dev/null || true
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER"
          echo "SDKMANAGER_DIR=$(dirname "$SDKMANAGER")" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Read app version
        shell: bash
        run: |
          VERSION=$(grep -E "versionName ['"]+[0-9]+\.[0-9]+\.[0-9]+['"]" app/build.gradle | sed -E "s/.*versionName ['"]([^'"]+)['"].*/\1/")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Prepare versioned APK filename
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/TeleprompterPro-v${VERSION}.apk"

      - name: Upload versioned APK
        uses: actions/upload-artifact@v4
        with:
          name: TeleprompterPro-v${{ env.VERSION }}-debug
          path: app/build/outputs/apk/debug/TeleprompterPro-v${{ env.VERSION }}.apk
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION=$(grep -E "versionName ['\"]+[0-9]+\.[0-9]+\.[0-9]+['\"]" app/build.gradle | sed -E "s/.*versionName ['\"]([^'\"]+)['\"].*/\1/")
          echo "Releasing version $VERSION"
          gh release create "v$VERSION" app/build/outputs/apk/debug/app-debug.apk \
            --title "Teleprompter Pro v$VERSION" \
            --generate-notes
