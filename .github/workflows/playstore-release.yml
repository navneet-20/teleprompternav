name: Play Store Production Build

on:
  workflow_dispatch:
  push:
    branches:
      - 'playstore/**'

permissions:
  contents: read

jobs:
  production-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Android SDK tools
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          test -n "$SDKMANAGER"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Restore upload keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64"
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/teleprompter-upload.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/teleprompter-upload.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK and AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          gradle :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace

      - name: Read version
        shell: bash
        run: |
          VERSION=$(grep -o "versionName '[^']*'" app/build.gradle | cut -d"'" -f2)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Prepare production artifacts
        shell: bash
        run: |
          cp app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/TeleprompterPro-v${VERSION}-release.apk"
          cp app/build/outputs/bundle/release/app-release.aab "app/build/outputs/bundle/release/TeleprompterPro-v${VERSION}-release.aab"

      - name: Verify AAB signature
        run: |
          jarsigner -verify -verbose -certs "app/build/outputs/bundle/release/TeleprompterPro-v${VERSION}-release.aab"

      - name: Upload Play Store artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TeleprompterPro-v${{ env.VERSION }}-playstore
          path: |
            app/build/outputs/apk/release/TeleprompterPro-v${{ env.VERSION }}-release.apk
            app/build/outputs/bundle/release/TeleprompterPro-v${{ env.VERSION }}-release.aab
          if-no-files-found: error
